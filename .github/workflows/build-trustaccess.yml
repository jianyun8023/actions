name: Build TrustAccess Docker Image

on: 
  workflow_dispatch:
    inputs:
      version:
        description: "Version"
        required: true
        default: "3.2.38.8"
  push:
    paths:
      - 'docker/trustaccess/**'
    branches:
      - main

env:
  IMAGE_NAME: docker-trustaccess
  VERSION: ${{ inputs.version || '3.2.38.8' }}

jobs:
  build:
    name: Build linux/amd64
    runs-on: ubuntu-latest

    steps:
      - name: Prepare
        run: |
          echo "REGISTRY_IMAGE=$(echo ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY_IMAGE }}
          tags: |
            type=raw,value=${{ env.VERSION }}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: docker/trustaccess
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Inspect image
        run: |
          docker buildx imagetools inspect ${{ env.REGISTRY_IMAGE }}:${{ env.VERSION }}
