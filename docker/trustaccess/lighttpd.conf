# lighttpd 配置 - TrustAccess VPN

server.modules = (
    "mod_indexfile",
    "mod_access",
    "mod_alias",
    "mod_cgi"
)

server.port = 8080
server.bind = "0.0.0.0"
server.document-root = "/var/www/html"
server.tag = "TrustAccess VPN"

index-file.names = ( "index.html" )

# 日志
server.errorlog = "/var/log/lighttpd/error.log"

# MIME 类型
mimetype.assign = (
    ".html" => "text/html",
    ".css" => "text/css",
    ".js" => "text/javascript",
    ".json" => "application/json"
)

# CGI 配置
cgi.assign = ( ".cgi" => "" )
alias.url = ( "/cgi-bin/" => "/var/www/cgi-bin/" )

$HTTP["url"] =~ "^/cgi-bin/" {
    cgi.assign = ( "" => "" )
}

# 禁止访问隐藏文件
$HTTP["url"] =~ "/\." {
    url.access-deny = ( "" )
}
